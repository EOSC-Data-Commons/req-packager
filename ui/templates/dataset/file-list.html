<ul class="tree" id="tree">
  <li>
    <details data-path="a-repo-example" open>
      <summary>
        <span class="folder" data-path="doi:base/example/dataset">base dataset repo: {{ uuid }} </span>
      </summary>
      <form 
        id="vre-selection-form"
        hx-post="/vre-recommend-from-files"
        hx-trigger="change delay:400ms from:input[type=checkbox]"
        hx-target="#vre-selection"
        hx-swap="innerHTML"
        >
        <ul>
          {% for file in files %}
          <li class="file"">
            <span class="icon">
              {% if file.is_dir %}
                📁
              {% else %}
                📄
              {% endif %}
            </span>
            {% if not file.is_dir %}
            <input 
              type="checkbox"
              name="{{file.filename}}"
              value="{{ file.download_url }}"
            />
            {% endif %}
            <span class="name">{{ file.filename }}{% if file.is_dir %}/{% endif %}</span>
            <span class="meta">
              <span class="type">{{ file.mimetype }}</span>
              <span class="size">{{ file.size }}</span>
            </span>
            {% if not file.is_dir %}
            <!-- tool button for file -->
            <button 
            class="tool-btn" 
            title="preview" 
            hx-get="/preview"
            hx-target="#file-preview"
            hx-swap="outerHTML"
            hx-vals='{"mimetype": "{{ file.mimetype }}", "url": "{{ file.download_url}}"}'>
              preview
            </button>
            {% endif %}
            <!-- dropdown button -->
            <div class="dropdown">
              <button onclick="console.log('dropdown')" class="dropdown-btn" data-action="toggle-dropdown" type="button">Open with ▾</button>
              <div class="dropdown-content">
                <button data-action="open-file" data-path="{{ file.data_path }}" type="button">
                  Tool x
                </button>
                <button onclick="console.log('Tool 2 clicked')" type="button">Tool 2</button>
                <button onclick="console.log('Tool 3 clicked')" type="button">Tool 3</button>
              </div>
            </div>
            <a
              href="/download?url={{ file.download_url }}"
              target="_blank"
              rel="noopener"
            >
              <button type="button">Download</button>
            </a>
          </li>
          {% endfor %}
        </ul>
      </form>
    </details>
  </li>
</ul>
