<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>File List</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    <link rel="stylesheet" href="/assets/css/search-result-page.css">
  </head>
  <body class="search-result">
    <h2>List of search results</h2>
    {% for ds in datasets %} 
    <div class="dataset-card">
      <p>{{ ds.description }}</p>
      <div class="actions">
        <a href="/datasets/{{ ds.uuid }}" class="btn">View</a>
        <a href="{{ ds.source_url }}" target="_blank" class="btn">Source</a>
      </div>
    </div>
    {% endfor %}
  </body>
</html>
