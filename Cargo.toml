[package]
name = "req_packager"
name = "poc-ui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rp_server"
path = "src/server.rs"

[[bin]]
name = "rp_client"
path = "src/client.rs"

[dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
futures-core = "0.3.31"
futures-util = "0.3.31"
prost = "0.14.1"
prost-types = "0.14.1"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.146"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.17"
tonic = "0.14.2"
tonic-prost = "0.14.2"
url = "2.5.8"
uuid = { version = "1.21.0", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "*"
