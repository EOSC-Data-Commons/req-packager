[package]
name = "req_packager"
name = "poc-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.8", features = ["tokio", "http2"] }
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread"] }
tower-http = { version = "0.6.8", features = ["fs"] }
tera = { version = "1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
humansize = "2.1.3"
