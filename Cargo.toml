[package]
name = "req_packager"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rp-mock"
path = "src/server.rs"

[[bin]]
name = "rp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
futures-core = "0.3.31"
futures-util = "0.3.31"
prost = "0.14.1"
prost-types = "0.14.1"
rand = "0.10.0"
serde_json = "1.0.146"
tokio-stream = "0.1.17"
tonic = "0.14.2"
tonic-prost = "0.14.2"
url = "2.5.8"
uuid = { version = "1.22.0", features = ["serde", "v4", "v5"] }
# ui
axum = { version = "0.8.8", features = ["tokio", "http2"] }
tower-http = { version = "0.6.8", features = ["fs"] }
tera = { version = "1", default-features = false }
humansize = "2.1.3"
# shared
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "rt"] }
serde = { version = "1.0.228", features = ["derive", "std"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
once_cell = "1.21.3"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
tokio-util = "0.7.18"
futures = "0.3.32"
hyper = "1.8.1"
exn = "0.3.0"
indicatif = "0.18.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tonic-health = "0.14.5"
datahugger = "0.6.4"
reqwest-middleware = { version = "0.5.1", features = ["query"] }
form_urlencoded = "1.2.2"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "time"] }

[build-dependencies]
tonic-prost-build = "*"
